[project]
name = "rsx"
version = "0.1.0"
description = "Report structuring with vLLM: radiology reports (CSV) -> one typed template, JSON-schema constrained decoding"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.60",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "pyarrow>=15",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
download = ["huggingface_hub>=0.30"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rsx = "rsx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsx"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
